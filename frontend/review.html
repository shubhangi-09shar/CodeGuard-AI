<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodeGuard — Review Result</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #eee5da;
      --sand: #dcc7ae;
      --dusty-pink: #c9aaa5;
      --burgundy: #5a1118;
      --charcoal: #302624;
      --muted: #756762;
      --white: #fffaf5;
      --border: #d8c7b9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--charcoal);
      font-family: "DM Sans", sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 80px));
      margin: auto;
    }

    .topbar {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--burgundy);
      text-decoration: none;
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 600;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }

    nav a:hover {
      color: var(--burgundy);
    }

    .content {
      padding: 60px 0;
    }

    .eyebrow {
      color: var(--burgundy);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 46px;
      letter-spacing: -2px;
    }

    .summary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .review-card {
      margin-top: 35px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--white);
    }

    .pr-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .pr-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 21px;
      font-weight: 600;
    }

    .pr-info {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .github-link {
      color: var(--burgundy);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .section {
      margin-top: 32px;
    }

    .section h2 {
      margin-bottom: 14px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 19px;
    }

    .issue {
      margin-top: 10px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #f7eee6;
    }

    .issue strong {
      color: var(--burgundy);
      font-size: 12px;
    }

    .issue p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .ai-review {
      margin-top: 14px;
      padding: 22px;
      border: 1px solid #cdb6ad;
      border-radius: 11px;
      background: #f5e9df;
    }

    .ai-review h3 {
      margin-top: 8px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 17px;
    }

    .ai-review p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    pre {
      margin-top: 12px;
      padding: 16px;
      overflow-x: auto;
      border-radius: 8px;
      background: #302624;
      color: #fffaf5;
      font: 12px/1.6 monospace;
    }

    .file {
      margin-top: 10px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #f7eee6;
    }

    .file-name {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
    }

    .file-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .file pre {
      margin-top: 12px;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .page {
        width: min(100% - 32px, 600px);
      }

      .pr-meta {
        flex-direction: column;
      }

      nav a {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">

      <a href="dashboard.html" class="brand">
        CodeGuard
      </a>

      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="analyze.html">Analyze PR</a>
        <a href="history.html">History</a>
      </nav>

    </header>

    <main class="content">

      <p class="eyebrow">Code review complete</p>

      <h1>Review Result</h1>

      <p class="summary">
        CodeGuard's analysis of your pull request.
      </p>

      <section id="review-container" class="review-card">
        <p class="empty">
          Loading review...
        </p>
      </section>

    </main>

  </div>
 
  <script>
    const user = JSON.parse(
  sessionStorage.getItem("codeguardUser")
);

if (!user) {
  window.location.href = "login.html";
}
    const container = document.querySelector("#review-container");

    const review = JSON.parse(
      sessionStorage.getItem("codeguardReview")
    );

    if (!review) {
      container.innerHTML = `
        <p class="empty">
          No review data found. Please analyze a pull request first.
        </p>
      `;
    } else {

      const complexity = review.complexity_issues || [];
      const security = review.security_issues || [];
      const secrets = review.secret_issues || [];
      const aiReviews = review.ai_review || [];
      const files = review.files || [];

      container.innerHTML = `
        <div class="pr-meta">
          <div>
            <div class="pr-title">
              ${review.title}
            </div>

            <div class="pr-info">
              PR #${review.pull_request}
              · ${review.repository}
              · ${review.author}
            </div>

            <div class="pr-info">
              +${review.additions}
              additions ·
              -${review.deletions}
              deletions ·
              ${review.changed_files}
              file(s) changed
            </div>
          </div>

          ${
            review.html_url
              ? `<a
                  class="github-link"
                  href="${review.html_url}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  View on GitHub →
                </a>`
              : ""
          }
        </div>

        <div class="section">
          <h2>Complexity Issues</h2>

          ${
            complexity.length
              ? complexity.map(issue => `
                  <div class="issue">
                    <strong>
                      ${issue.severity} · Line ${issue.line}
                    </strong>

                    <p>${issue.message}</p>
                  </div>
                `).join("")
              : `<p class="empty">No complexity issues found.</p>`
          }
        </div>

        <div class="section">
          <h2>Security Issues</h2>

          ${
            security.length
              ? security.map(issue => `
                  <div class="issue">
                    <strong>
                      ${issue.severity} · Line ${issue.line}
                    </strong>

                    <p>${issue.message}</p>
                  </div>
                `).join("")
              : `<p class="empty">No security issues found.</p>`
          }
        </div>

        <div class="section">
          <h2>Secret Issues</h2>

          ${
            secrets.length
              ? secrets.map(issue => `
                  <div class="issue">
                    <strong>
                      ${issue.severity} · Line ${issue.line}
                    </strong>

                    <p>${issue.message}</p>
                  </div>
                `).join("")
              : `<p class="empty">No hardcoded secrets found.</p>`
          }
        </div>

        <div class="section">
          <h2>AI Code Review</h2>

          ${
            aiReviews.length
              ? aiReviews.map(item => `
                  <div class="ai-review">

                    <strong>${item.filename}</strong>

                    <p>${item.review.summary}</p>

                    ${
                      item.review.issues && item.review.issues.length
                        ? item.review.issues.map(issue => `
                            <div class="issue">

                              <strong>
                                ${issue.severity} · ${issue.category}
                              </strong>

                              <h3>
                                ${issue.title}
                              </h3>

                              <p>
                                <strong>Why it matters:</strong><br>
                                ${issue.explanation}
                              </p>

                              <p>
                                <strong>Suggested fix:</strong><br>
                                ${issue.suggestion}
                              </p>

                              ${
                                issue.corrected_code
                                  ? `
                                    <p>
                                      <strong>Corrected code:</strong>
                                    </p>

                                    <pre>${issue.corrected_code}</pre>
                                  `
                                  : ""
                              }

                            </div>
                          `).join("")
                        : `<p>No AI issues found.</p>`
                    }

                  </div>
                `).join("")
              : `<p class="empty">No AI review available.</p>`
          }
        </div>

        <div class="section">
          <h2>Changed Files</h2>

          ${
            files.length
              ? files.map(file => `
                  <div class="file">

                    <div class="file-name">
                      ${file.filename}
                    </div>

                    <div class="file-meta">
                      ${file.status}
                      · +${file.additions}
                      · -${file.deletions}
                    </div>

                    ${
                      file.patch
                        ? `<pre>${file.patch}</pre>`
                        : `<p class="empty">No patch available.</p>`
                    }

                  </div>
                `).join("")
              : `<p class="empty">No changed files available.</p>`
          }
        </div>
      `;
    }
  </script>

</body>
</html>
