<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodeGuard — Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #eee5da;
      --burgundy: #5a1118;
      --burgundy-light: #731c25;
      --charcoal: #302624;
      --muted: #756762;
      --white: #fffaf5;
      --border: #d8c7b9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--charcoal);
      font-family: "DM Sans", sans-serif;
    }

    .login-card {
      width: min(430px, calc(100% - 40px));
      padding: 42px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
    }

    .brand {
      color: var(--burgundy);
      font-family: "Space Grotesk", sans-serif;
      font-size: 24px;
      font-weight: 600;
    }

    .eyebrow {
      margin-top: 45px;
      color: var(--burgundy);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 9px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .intro {
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    form {
      margin-top: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 45px;
      margin-bottom: 18px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      color: var(--charcoal);
      background: #f5ede4;
      font: 13px "DM Sans", sans-serif;
    }

    input:focus {
      border-color: var(--burgundy);
    }

    button {
      width: 100%;
      height: 45px;
      border: 0;
      border-radius: 7px;
      color: var(--white);
      background: var(--burgundy);
      cursor: pointer;
      font: 600 13px "DM Sans", sans-serif;
    }

    button:hover {
      background: var(--burgundy-light);
    }

    .signup {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .signup a {
      color: var(--burgundy);
      font-weight: 600;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 25px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="brand">
      CodeGuard
    </div>

    <p class="eyebrow">Welcome back</p>

    <h1>Sign in to CodeGuard.</h1>

    <p class="intro">
      Access your dashboard and review history.
    </p>

    <form id="login-form">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Sign in →
      </button>

    </form>

    <p class="signup">
      New to CodeGuard?
      <a href="signup.html">Create an account</a>
    </p>

    <a href="welcome.html" class="back">
      ← Back to CodeGuard
    </a>

  </main>
<script>
  const loginForm = document.querySelector("#login-form");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.querySelector("#email").value.trim();
    const password = document.querySelector("#password").value;

    try {
      const response = await fetch(
        "http://127.0.0.1:8000/api/login",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || "Login failed.");
      }

      sessionStorage.setItem(
        "codeguardUser",
        JSON.stringify({
          user_id: data.user_id,
          name: data.name,
          email: data.email
        })
      );

      window.location.href = "dashboard.html";

    } catch (error) {
      alert(error.message);
    }
  });
</script>

</body>
</html>
